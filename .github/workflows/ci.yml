name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and Formatting with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v

      - name: Validate AWS SAM Template
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --template infrastructure/template.yaml --lint
