repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (Gitleaks)
        entry: gitleaks protect --verbose --redact --staged
        language: golang
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: sentinelpr-staged
        name: SentinelPR Local Staged Diff Scanner
        entry: python -m sentinelpr.cli scan --staged --offline
        language: system
        pass_filenames: false
        always_run: true
