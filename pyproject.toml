[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelpr"
version = "0.1.0"
description = "Automated Git Code Review & Security Auditor"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SentinelPR Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "boto3>=1.35.0",
    "aws-lambda-powertools[all]>=3.3.0",
    "pip-audit>=2.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "moto[dynamodb,sqs,secretsmanager]>=5.0.0",
    "respx>=0.21.0",
    "semgrep>=1.90.0",
]

[project.scripts]
sentinelpr = "sentinelpr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501", # Line too long (handled by ruff format)
    "S101", # Use of assert detected (needed in tests)
    "S104", # Possible binding to all interfaces (used in config checks/fixtures)
    "S105", # Possible hardcoded password (flagged on fake test credentials)
    "S106", # Possible hardcoded password func argument
    "S107", # Possible hardcoded password default argument
    "S603", # subprocess call without shell=True check (we strictly validate args)
    "S607", # Starting a process with a partial executable path
    "S110", # try-except-pass (intentional graceful error recovery)
    "S112", # try-except-continue (intentional graceful error recovery)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S602", "S608", "S108"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
